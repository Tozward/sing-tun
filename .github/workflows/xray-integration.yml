name: Xray native integration regressions

on:
  push:
    branches: [feature/xray-native-tun]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compile library and platform tests
        run: go test -c -o native-test${{ runner.os == 'Windows' && '.exe' || '' }} .
      - name: Download and ownership contracts
        if: runner.os != 'Windows'
        run: go test -race . -run 'TestGoDownload|TestGoFullSplice|TestNativeTunConstruction|TestNativeTunExternal|TestUseSocket' -count=3 -timeout=3m
      - name: Linux privileged descriptor and socket regressions
        if: runner.os == 'Linux'
        run: |
          go test -race -c -o native-test .
          sudo ./native-test -test.v -test.run 'TestNativeTunOwned|TestGoKernelDownloadSplice' -test.count=3 -test.timeout=3m
